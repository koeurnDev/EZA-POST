<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZA-POST Facebook Sync Extension</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="logo-box">⚡</div>
        <div class="brand-text">
          <span class="brand-name">EZA-POST</span>
          <span class="brand-sub">Facebook 1-Click Sync</span>
        </div>
      </div>
      <span class="badge" id="fbStatusBadge">កំពុងពិនិត្យ...</span>
    </div>

    <!-- Facebook Session Card -->
    <div class="session-card" id="sessionCard">
      <div class="session-info">
        <span class="label">ស្ថានភាពគណនី Facebook លើ Browser:</span>
        <div class="status-row">
          <span class="dot" id="statusDot"></span>
          <span class="user-text" id="fbUserText">កំពុងស្វែងរកគណនី...</span>
        </div>
      </div>
    </div>

    <!-- Main Action Button -->
    <button class="btn-sync" id="btnSync">
      <span class="btn-icon">⚡</span>
      <span class="btn-text" id="btnSyncText">Sync ផេក Facebook ទៅ EZA-POST (1-Click)</span>
    </button>

    <!-- Secondary Action: Open EZA-POST Connections Page -->
    <div class="action-grid" style="grid-template-columns: 1fr;">
      <button class="btn-secondary" id="btnOpenDashboard">
        <span>🌐</span> បើកទំព័រភ្ជាប់ផេក EZA-POST
      </button>
    </div>

    <!-- Feedback Message Box -->
    <div class="message-box hidden" id="messageBox">
      <div class="message-content" id="messageContent"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>🔒 100% Extension Sync • គ្មានការបញ្ចូល Token ដោយដៃ</span>
      <span>v2.0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
