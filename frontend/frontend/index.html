    content="Moneaa, moneaa.site, Digital Business Card, Bakong KHQR, Khmer Subtitle, CapCut Draft, AI Subtitle Studio" />

  <meta property="og:title" content="Moneaa - Digital Business Card & Khmer AI Subtitles" />
  <meta property="og:description" content="បង្កើតកាតអាជីវកម្មឌីជីថលឆ្លាតវៃ Bakong KHQR និងបម្លែងអក្សររត់ AI ខ្មែរ នៅលើ moneaa.site" />
  <meta name="theme-color" content="#3b82f6" />

  <!-- Title -->
  <title>Moneaa - Digital Business Card & Khmer AI Subtitles Studio</title>

  <!-- PWA & Mobile Web App Support -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moneaa" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Preload main stylesheet -->

</head>

<body>
  <div id="root">
    <!-- 🚀 Fallback loading screen before React mounts -->
    <div style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          font-family: 'Kantumruy Pro', sans-serif;
        ">
      <div style="text-align: center;">
        <div style="font-size: 48px; margin-bottom: 16px;">🚀</div>
        <h1 style="margin-bottom: 8px; font-size: 28px;">Moneaa</h1>
        <p style="opacity: 0.85;">Loading moneaa.site...</p>
        <div style="
              margin-top: 20px;
              width: 40px;
              height: 40px;
              border: 3px solid rgba(255,255,255,0.3);
              border-top: 3px solid white;
              border-radius: 50%;
              animation: spin 1s linear infinite;
              margin-left: auto;
              margin-right: auto;
            "></div>
      </div>
    </div>
  </div>

  <!-- Fallback loading spinner animation -->
  <style>
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Vite entry point -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Unregister old service workers (for clean development builds) -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const reg of registrations) {
          console.log("🧹 Unregistering old Service Worker:", reg);
          reg.unregister();
        }
      });
    }
  </script>
</body>

</html>
